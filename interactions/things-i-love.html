    .brand-dot {

      display: inline-block;

    .brand-dot.solid {

      animation: none;
    }
    @keyframes dot-blink {
      0%, 49% { opacity: 1; }

    .nav-counter {
      padding: 0 14px;
    }
    .nav-arrow {
      padding: 0 14px;
    }
    .nav-arrow span {
      display: inline-block;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 14px;
    }
    .nav-arrow.open span {
      transform: rotate(45deg);
    }
    .nav-name {
      padding: 0 18px;

    .nav-name.selected {
      background: #ffffff;
      color: #004FFF;
    }
    .nav-spacer {
      flex: 1 1 auto;
      border-right: none;

    .nav-hint {
      border-left: 1.5px solid #ffffff;
      border-right: none;
      padding: 0 18px;
    }
    @media (max-width: 999px) {
      .nav-hint {
        display: none;
      }
    }
    @media (max-width: 720px) {
      .navbar {
        font-size: 11px;

      position: fixed;
      top: 48px;
      left: 0;
      width: min(420px, 100vw);
      background: #ffffff;
      color: #004FFF;
      border-right: 1.5px solid #ffffff;
      border-bottom: 1.5px solid #ffffff;

      overflow-y: auto;
    }
    .info-panel.open {
      clip-path: inset(0 0 0% 0);
      pointer-events: auto;
    }

      opacity: 0;

    }
    .info-panel.open .panel-line {
      opacity: 1;
      transform: translateY(0);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-family: "Silkscreen", monospace;
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .panel-close {
      width: 26px;
      height: 26px;
      border: 1.5px solid #004FFF;
      background: #ffffff;
      color: #004FFF;
      font-family: "Silkscreen", monospace;
      font-size: 12px;
      display: grid;
      place-items: center;
    }
    .panel-close:hover {
      background: #004FFF;
      color: #ffffff;
    }
    .panel-intro {
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
      font-weight: 500;
    }
    .panel-foot {
      margin-top: 20px;
      font-family: "Silkscreen", monospace;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.03em;
      opacity: 0.85;
    }
    .panel-section + .panel-section {
      margin-top: 16px;
    }
    .panel-subhead {
      font-family: "Silkscreen", monospace;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1.5px solid rgba(0, 79, 255, 0.22);
    }
    .panel-list {
      list-style: none;
      font-size: 14px;
      line-height: 1.55;
    }
    .panel-list li {
      position: relative;
      padding-left: 18px;
    }
    .panel-list li::before {
      content: "↳";
      position: absolute;
      left: 2px;
      font-weight: 700;
    }
    @media (max-width: 600px) {
      .info-panel {
        padding: 16px 16px 18px;
        max-height: 46vh;
      }
      .panel-intro {
        font-size: 14px;
        margin-bottom: 12px;
      }
    }
    /* Custom pixel-art SVG cursor */
    #pixel-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 60px;
      height: 100px;
      pointer-events: none;
      z-index: 100;
      transform-origin: 0 0;
      will-change: transform;
      display: none;

    @media (hover: hover) and (pointer: fine) {
      #pixel-cursor.visible {

      }
    }

        transition-delay: 0ms !important;
      }

    rimLight.position.set(6, -8, -14);
    scene.add(rimLight);

    // Shared materials
    const sharedMaterial = new THREE.MeshStandardMaterial({
      color: 0x004FFF,
      flatShading: true,
      roughness: 0.55,
      metalness: 0.05
    });

    const highlightMaterial = new THREE.MeshStandardMaterial({
      color: 0x1e6bff,
      emissive: 0x3d7bff,
      emissiveIntensity: 0.42,
      flatShading: true,
      roughness: 0.5,
      metalness: 0.05
    });

    // Cannon-es physics world
    const world = new CANNON.World();
    world.gravity.set(0, -28, 0);
    world.allowSleep = true;
    world.broadphase = new CANNON.SAPBroadphase(world);
    world.solver.iterations = 20;
    world.defaultContactMaterial.restitution = 0.22;
    world.defaultContactMaterial.friction = 0.28;
    const wallMat = new CANNON.Material("wall");
    const objMat = new CANNON.Material("obj");
    world.addContactMaterial(new CANNON.ContactMaterial(wallMat, objMat, { friction: 0.0, restitution: 0.2 }));
    world.addContactMaterial(new CANNON.ContactMaterial(objMat, objMat, { friction: 0.25, restitution: 0.2 }));

    // Invisible static walls
    const walls = {
      floor: new CANNON.Body({ mass: 0, material: wallMat, shape: new CANNON.Plane() }),
      left: new CANNON.Body({ mass: 0, material: wallMat, shape: new CANNON.Plane() }),
      right: new CANNON.Body({ mass: 0, material: wallMat, shape: new CANNON.Plane() }),
      front: new CANNON.Body({ mass: 0, material: wallMat, shape: new CANNON.Plane() }),
      back: new CANNON.Body({ mass: 0, material: wallMat, shape: new CANNON.Plane() })
    };
    walls.floor.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    walls.left.quaternion.setFromEuler(0, Math.PI / 2, 0);
    walls.right.quaternion.setFromEuler(0, -Math.PI / 2, 0);
    walls.front.quaternion.setFromEuler(0, Math.PI, 0);
    walls.back.quaternion.setFromEuler(0, 0, 0);
    Object.values(walls).forEach(w => world.addBody(w));

    function getViewportWorldSize() {
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const visH = 2 * camera.position.z * Math.tan(fovRad / 2);
      const visW = visH * camera.aspect;
      return { visW, visH };
    }

    function updateWalls() {
      const { visW, visH } = getViewportWorldSize();
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      walls.floor.position.set(0, -visH / 2 - 2.4 * Math.tan(fovRad / 2), 0);
      walls.left.position.set(-visW / 2, 0, 0);
      walls.right.position.set(visW / 2, 0, 0);
      walls.front.position.set(0, 0, 2.8);
      walls.back.position.set(0, 0, -2.8);
    }
    updateWalls();

    // Precompute 26 k-DOP directions
    const KDOP_DIRS = [];
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dz = -1; dz <= 1; dz++) {
          if (dx === 0 && dy === 0 && dz === 0) continue;
          KDOP_DIRS.push(new THREE.Vector3(dx, dy, dz).normalize());
        }
      }
    }

    // Build a k-DOP + ConvexHull CANNON.ConvexPolyhedron collider from a Three.js Object3D at a given scale
    function buildColliderForObject(rootGroup, scaleValue, objSize) {
      rootGroup.scale.setScalar(scaleValue);
      rootGroup.updateMatrixWorld(true);
      const invRoot = new THREE.Matrix4().copy(rootGroup.matrixWorld).invert();
      const scaleMat = new THREE.Matrix4().makeScale(scaleValue, scaleValue, scaleValue);

      const allVerts = [];
      const tmp = new THREE.Vector3();
      rootGroup.traverse((child) => {
        if (child.isMesh && child.geometry && child.geometry.attributes.position) {
          const pos = child.geometry.attributes.position;
          const m = new THREE.Matrix4().multiplyMatrices(invRoot, child.matrixWorld);
          m.premultiply(scaleMat);
          for (let i = 0; i < pos.count; i++) {
            tmp.fromBufferAttribute(pos, i).applyMatrix4(m);
            allVerts.push(tmp.clone());
          }
        }
      });

      // 1. Extreme vertex in each of 26 k-DOP directions
      const extremePts = [];
      for (const dir of KDOP_DIRS) {
        let bestDot = -Infinity;
        let bestPt = null;
        for (const v of allVerts) {
          const d = v.dot(dir);
          if (d > bestDot) {
            bestDot = d;
            bestPt = v;
          }
        }
        if (bestPt) extremePts.push(bestPt.clone());
      }

      // 2. Merge points closer together than 8% of object's size
      const mergeDist = 0.08 * objSize;
      const mergeDistSq = mergeDist * mergeDist;
      const mergedPts = [];
      for (const p of extremePts) {
        let found = false;
        for (const q of mergedPts) {
          if (p.distanceToSquared(q) < mergeDistSq) {
            q.add(p).multiplyScalar(0.5);
            found = true;
            break;
          }
        }
        if (!found) mergedPts.push(p.clone());
      }

      // Ensure hull points fit comfortably within the z = +-2.8 slab when tumbling
      for (const p of mergedPts) {
        p.z = Math.max(-2.1, Math.min(2.1, p.z));
      }

      // 3. Wrap in Three's ConvexHull and centre on its centroid
      const hull = new ConvexHull().setFromPoints(mergedPts);
      const centroid = new THREE.Vector3();
      if (hull.vertices.length > 0) {
        for (const v of hull.vertices) centroid.add(v.point);
        centroid.divideScalar(hull.vertices.length);
      }

      const vertMap = new Map();
      const cannonVerts = [];
      const faces = [];
      const faceNormals = [];

      function getVertIndex(pt) {
        for (let i = 0; i < cannonVerts.length; i++) {
          const cv = cannonVerts[i];
          const dx = cv.x - (pt.x - centroid.x);
          const dy = cv.y - (pt.y - centroid.y);
          const dz = cv.z - (pt.z - centroid.z);
          if (dx * dx + dy * dy + dz * dz < 1e-6) return i;
        }
        const idx = cannonVerts.length;
        cannonVerts.push(new CANNON.Vec3(pt.x - centroid.x, pt.y - centroid.y, pt.z - centroid.z));
        return idx;
      }

      for (const face of hull.faces) {
        const faceIndices = [];
        let edge = face.edge;
        do {
          const idx = getVertIndex(edge.head().point);
          if (!faceIndices.includes(idx)) faceIndices.push(idx);
          edge = edge.next;
        } while (edge !== face.edge);

        if (faceIndices.length >= 3) {
          faces.push(faceIndices);
          faceNormals.push(new CANNON.Vec3(face.normal.x, face.normal.y, face.normal.z));
        }
      }

      let shape;
      try {
        shape = new CANNON.ConvexPolyhedron({
          vertices: cannonVerts,
          faces,
          normals: faceNormals
        });
      } catch (e) {
        const box = new THREE.Box3().setFromPoints(mergedPts);
        const sz = new THREE.Vector3();
        box.getSize(sz);
        shape = new CANNON.Box(new CANNON.Vec3(Math.max(0.1, sz.x / 2), Math.max(0.1, sz.y / 2), Math.max(0.1, sz.z / 2)));
      }

      return {
        shape,
        offset: new CANNON.Vec3(centroid.x, centroid.y, centroid.z)
      };
    }

    // Build a shut-laptop box collider
    function buildClosedLaptopBox(scaleValue) {
      // In normalized laptop space (maxSide = 1), width is 1.0, closed thickness is ~0.09, depth is ~0.69
      const s = Math.min(scaleValue, 4.4);
      const hx = 0.48 * s;
      const hy = 0.055 * s;
      const hz = 0.34 * s;
      return {
        shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)),
        offset: new CANNON.Vec3(0, -0.02 * s, 0.08 * s)
      };
    }

    // Load the 5 GLB templates
    const gltfLoader = new GLTFLoader();
    const templates = {};

    async function loadTemplates() {
      await Promise.all(MODEL_SPECS.map(async (spec) => {
        const gltf = await gltfLoader.loadAsync(GLB_DATA[spec.key]);
        const root = new THREE.Group();
        const model = gltf.scene;

        model.traverse((child) => {
          if (child.isMesh) {
            child.material = sharedMaterial;
            if (child.geometry) {
              child.geometry.computeVertexNormals();
            }
          }
        });

        // Center and normalize model so its longest side = 1 in root space
        const box = new THREE.Box3().setFromObject(model);
        const center = new THREE.Vector3();
        const size = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);
        const maxSide = Math.max(size.x, size.y, size.z) || 1;

        model.position.sub(center);
        const normGroup = new THREE.Group();
        normGroup.scale.setScalar(1 / maxSide);
        normGroup.add(model);
        root.add(normGroup);

        templates[spec.key] = {
          root,
          maxSide,
          center,
          nudge: spec.nudge,
          pose: spec.pose
        };
      }));
    }

    // Clone a template and set up laptop hinge if key === 'laptop'
    function createInstanceMesh(key) {
      const tpl = templates[key];
      const root = tpl.root.clone(true);
      let laptopHinge = null;

      root.traverse((child) => {
        if (child.isMesh) {
          child.material = sharedMaterial;
        }
      });

      if (key === 'laptop') {
        const lidNode = root.getObjectByName('group256948792');
        const deckNode = root.getObjectByName('group485226736');
        if (lidNode && lidNode.parent) {
          const parent = lidNode.parent;
          // Back edge of the keyboard deck in raw model coordinates: y ≈ -0.06, z ≈ -0.655
          const hingePivotPos = new THREE.Vector3(0, -0.06, -0.655);
          const hingeGroup = new THREE.Group();
          hingeGroup.name = 'laptopHingeGroup';
          hingeGroup.position.copy(hingePivotPos);
          parent.add(hingeGroup);

          lidNode.position.sub(hingePivotPos);
          hingeGroup.add(lidNode);
          hingeGroup.rotation.x = -0.3;
          laptopHinge = {
            group: hingeGroup,
            baseY: hingePivotPos.y,
            baseZ: hingePivotPos.z
          };
        }
      }

      return { root, laptopHinge };
    }

    // Active pile items
    const items = [];
    const spawnTimers = [];
    let featuredItem = null;
    const discoveredKeys = new Set();

    // Shockwave state on empty-space click
    let shockwave = null;

    function computeTargetPileSize(key) {
      const { visW, visH } = getViewportWorldSize();
      const base = Math.max(visW, visH) * 0.30;
      const spec = MODEL_SPECS.find(s => s.key === key);
      return base * (spec ? spec.nudge : 1.0);
    }

    function applyColliderToBody(item, scaleValue, useClosedBox = false) {
      while (item.body.shapes.length > 0) {
        item.body.removeShape(item.body.shapes[0]);
      }
      const built = useClosedBox
        ? buildClosedLaptopBox(scaleValue)
        : buildColliderForObject(item.mesh, scaleValue, scaleValue);
      item.body.addShape(built.shape, built.offset);
      item.body.updateMassProperties();
      item.body.updateBoundingRadius();
      item.lastColliderScale = scaleValue;
      item.isBoxCollider = useClosedBox;
    }

    function spawnSingleItem(key, dropImmediately = false) {
      const { visW, visH } = getViewportWorldSize();
      const size = computeTargetPileSize(key);
      const { root, laptopHinge } = createInstanceMesh(key);
      root.scale.setScalar(size);
      scene.add(root);

      const body = new CANNON.Body({
        mass: 1.2,
        material: objMat,
        linearDamping: 0.18,
        angularDamping: 0.6,
        allowSleep: true,
        sleepSpeedLimit: 0.15,
        sleepTimeLimit: 0.8
      });

      const margin = size * 0.55;
      const spawnX = (Math.random() - 0.5) * Math.max(1, visW - margin * 2);
      const spawnY = dropImmediately
        ? (Math.random() - 0.35) * (visH * 0.55)
        : visH / 2 + size * 0.75 + Math.random() * 0.6;
      const spawnZ = (Math.random() - 0.5) * 1.4;

      body.position.set(spawnX, spawnY, spawnZ);
      body.quaternion.setFromEuler(
        (Math.random() - 0.5) * 1.2,
        (Math.random() - 0.5) * 1.2,
        (Math.random() - 0.5) * 1.2
      );
      if (!dropImmediately) {
        body.angularVelocity.set(
          (Math.random() - 0.5) * 2.2,
          (Math.random() - 0.5) * 2.2,
          (Math.random() - 0.5) * 2.2
        );
      }

      const item = {
        key,
        mesh: root,
        body,
        size,
        currentScale: size,
        lastColliderScale: size,
        isBoxCollider: false,
        laptopHinge,
        lidAngle: -0.3,
        lidVel: 0,
        lidShut: false,
        inContact: false,
        lastContactTime: 0,
        leaveContactY: spawnY,
        bobPhase: Math.random() * Math.PI * 2
      };

      applyColliderToBody(item, size, false);

      // Listen for impacts on laptop to slam lid shut on hard impact (> 6)
      if (key === 'laptop') {
        body.addEventListener('collide', (ev) => {
          item.inContact = true;
          item.lastContactTime = performance.now();
          const impact = Math.abs(ev.contact.getImpactVelocityAlongNormal());
          if (impact > 6 && item !== featuredItem && !item.lidShut) {
            item.lidShut = true;
          }
        });
      }

      world.addBody(body);
      items.push(item);
      root.userData.item = item;
    }

    function clearPile() {
      while (spawnTimers.length > 0) {
        clearTimeout(spawnTimers.pop());
      }
      if (featuredItem) {
        closeFeaturePanel();
      }
      while (items.length > 0) {
        const it = items.pop();
        scene.remove(it.mesh);
        world.removeBody(it.body);
      }
    }

    function dropPile() {
      clearPile();
      // 3 copies of each model (15 total), shuffled
      const deck = [];
      for (const spec of MODEL_SPECS) {
        deck.push(spec.key, spec.key, spec.key);
      }
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      if (reducedMotion) {
        deck.forEach((key) => spawnSingleItem(key, true));
      } else {
        deck.forEach((key, idx) => {
          const timer = setTimeout(() => {
            spawnSingleItem(key, false);
          }, idx * 180);
          spawnTimers.push(timer);
        });
      }
    }

    // Highlight & Panel UI helpers
    function setItemHighlight(item, highlighted) {
      const mat = highlighted ? highlightMaterial : sharedMaterial;
      item.mesh.traverse((child) => {
        if (child.isMesh) child.material = mat;
      });
    }

    function renderPanelContent(info) {
      let lineIdx = 0;
      const nextDelay = () => `style="--d:${(lineIdx++) * 55}ms"`;

      const sectionsHtml = info.sections.map((sec) => `
        <div class="panel-section">
          <div class="panel-subhead panel-line" ${nextDelay()}>${sec.heading}</div>
          <ul class="panel-list">
            ${sec.items.map(li => `<li class="panel-line" ${nextDelay()}>${li}</li>`).join('')}
          </ul>
        </div>
      `).join('');

      panelEl.innerHTML = `
        <div class="panel-header-row panel-line" ${nextDelay()}>
          <span class="panel-kicker">A FEW THINGS ABOUT / ${info.index}</span>
          <button type="button" class="panel-close" id="panel-close-btn" aria-label="Close panel">ESC ✕</button>
        </div>
        <p class="panel-intro panel-line" ${nextDelay()}>${info.intro}</p>
        ${sectionsHtml}
      `;
      const closeBtn = document.getElementById("panel-close-btn");
      if (closeBtn) {
        closeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          closeFeaturePanel();
        });
      }
    }

    function selectItem(item) {
      if (featuredItem && featuredItem !== item) {
        returnItemToPile(featuredItem);
      }
      featuredItem = item;
      discoveredKeys.add(item.key);
      setItemHighlight(item, true);

      // Switch to kinematic body steered by velocity
      item.body.type = CANNON.Body.KINEMATIC;
      item.body.mass = 0;
      item.body.updateMassProperties();
      item.body.wakeUp();

      if (item.key === 'laptop') {
        item.lidShut = false;
      }

      const info = INFO[item.key];
      renderPanelContent(info);

      // Update navbar & panel
      brandDotEl.classList.add('solid');
      counterEl.textContent = `${info.index}/05`;
      arrowEl.classList.add('open');
      nameEl.textContent = info.label;
      nameEl.classList.add('selected');
      panelEl.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        panelEl.classList.add('open');
      });
    }

    function returnItemToPile(item) {
      setItemHighlight(item, false);
      item.body.type = CANNON.Body.DYNAMIC;
      item.body.mass = 1.2;
      item.currentScale = item.size;
      item.mesh.scale.setScalar(item.size);
      applyColliderToBody(item, item.size, item.key === 'laptop' && item.lidShut);
      item.body.wakeUp();
    }

    function closeFeaturePanel() {
      if (featuredItem) {
        returnItemToPile(featuredItem);
        featuredItem = null;
      }
      brandDotEl.classList.remove('solid');
      counterEl.textContent = `0${discoveredKeys.size}/05`;
      arrowEl.classList.remove('open');
      nameEl.textContent = 'CLICK SOMETHING';
      nameEl.classList.remove('selected');
      panelEl.classList.remove('open');
      panelEl.setAttribute('aria-hidden', 'true');
    }

    // Raycasting & click handling
    const raycaster = new THREE.Raycaster();
    const ndcPointer = new THREE.Vector2();
    const zZeroPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function screenToWorldOnZ0(clientX, clientY, targetVec) {
      ndcPointer.x = (clientX / window.innerWidth) * 2 - 1;
      ndcPointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(ndcPointer, camera);
      raycaster.ray.intersectPlane(zZeroPlane, targetVec);
      return targetVec;
    }

    let downPos = { x: 0, y: 0 };
    canvas.addEventListener('pointerdown', (e) => {
      downPos = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('click', (e) => {
      if (checkPointerOverUI(e.clientX, e.clientY)) return;
      if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 12) return;

      ndcPointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      ndcPointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(ndcPointer, camera);

      const meshes = items.map(it => it.mesh);
      const hits = raycaster.intersectObjects(meshes, true);

      let picked = null;
      if (hits.length > 0) {
        let obj = hits[0].object;
        while (obj && !obj.userData.item) obj = obj.parent;
        if (obj && obj.userData.item) picked = obj.userData.item;
      }

      // If nothing hit directly, take nearest object within a short distance (objects dodge cursor)
      const clickWorld = new THREE.Vector3();
      screenToWorldOnZ0(e.clientX, e.clientY, clickWorld);
      if (!picked) {
        let bestDist = 2.6;
        for (const it of items) {
          const dx = it.body.position.x - clickWorld.x;
          const dy = it.body.position.y - clickWorld.y;
          const d = Math.hypot(dx, dy) - it.currentScale * 0.45;
          if (d < bestDist) {
            bestDist = d;
            picked = it;
          }
        }
      }

      if (picked) {
        if (featuredItem === picked) {
          closeFeaturePanel();
        } else {
          selectItem(picked);
        }
      } else {
        if (featuredItem) {
          closeFeaturePanel();
        }
        // Empty space shockwave
        shockwave = {
          x: clickWorld.x,
          y: clickWorld.y,
          t: 0
        };
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (featuredItem) closeFeaturePanel();
      } else if (e.key === 'r' || e.key === 'R') {
        if (!e.metaKey && !e.ctrlKey && !e.altKey) {
          dropPile();
        }
      }
    });

    // Resize handling (debounced 200ms for model/collider refit)
    let resizeTimeout = null;
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      updateWalls();

      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        for (const item of items) {
          item.size = computeTargetPileSize(item.key);
          if (item !== featuredItem) {
            item.currentScale = item.size;
            item.mesh.scale.setScalar(item.size);
            applyColliderToBody(item, item.size, item.key === 'laptop' && item.lidShut);
            item.body.wakeUp();
          }
        }
      }, 200);
    });

    // Helper for featured target position & scale
    function getFeaturedTarget(item) {
      const { visW, visH } = getViewportWorldSize();
      const smallerSide = Math.min(visW, visH);
      const targetScale = Math.min(
        smallerSide * 0.70,
        Math.max(smallerSide * 0.42, item.size * 1.35)
      );

      let targetX = 0;
      let targetY = -0.3;
      const w = window.innerWidth;
      if (w <= 680) {
        // On phones, sits below the panel
        targetX = 0;
        targetY = -visH * 0.22;
      } else if (w < 1100) {
        // Middle of the space right of the 420px panel
        const panelFrac = 420 / w;
        targetX = (panelFrac * 0.5) * visW;
        targetY = -0.2;
      }

      const targetZ = 2.8 + 0.3 + 0.55 * targetScale;
      return { targetX, targetY, targetZ, targetScale };
    }

    // Main animation loop
    let lastTime = performance.now();
    const tmpQuat = new THREE.Quaternion();
    const targetQuat = new THREE.Quaternion();
    const deltaQuat = new THREE.Quaternion();
    const eulerTmp = new THREE.Euler();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
      lastTime = now;

      // Project pointer onto z = 0 plane and update smoothed cursor velocity
      if (pointerActive) {
        screenToWorldOnZ0(pointerClientX, pointerClientY, cursorWorld);
        if (!hasCursorSample) {
          prevCursorWorld.copy(cursorWorld);
          hasCursorSample = true;
        }
        const instVx = (cursorWorld.x - prevCursorWorld.x) / dt;
        const instVy = (cursorWorld.y - prevCursorWorld.y) / dt;
        prevCursorWorld.copy(cursorWorld);

        smoothedCursorVel.x = smoothedCursorVel.x * 0.75 + instVx * 0.25;
        smoothedCursorVel.y = smoothedCursorVel.y * 0.75 + instVy * 0.25;
        // Cap smoothed velocity magnitude so flicks never launch the pile
        const vLen = smoothedCursorVel.length();
        if (vLen > 18) {
          smoothedCursorVel.multiplyScalar(18 / vLen);
        }
      } else {
        smoothedCursorVel.multiplyScalar(0.85);
      }

      const cursorSpeed = Math.min(14, smoothedCursorVel.length());

      // Apply cursor repel to dynamic pile objects when pointer is not over UI
      if (pointerActive && !pointerOverUI) {
        for (const item of items) {
          if (item === featuredItem) continue;
          const bx = item.body.position.x;
          const by = item.body.position.y;
          const dx = bx - cursorWorld.x;
          const dy = by - cursorWorld.y;
          const dist = Math.hypot(dx, dy);
          const reach = 3.4 + 0.5 * item.size;

          if (dist < reach) {
            const t = Math.max(0, Math.min(1, 1 - dist / reach));
            const falloff = t * t * (3 - 2 * t);
            const forceMag = (70 + 4 * cursorSpeed) * falloff;
            const nx = dist > 1e-4 ? dx / dist : (Math.random() - 0.5);
            const ny = dist > 1e-4 ? dy / dist : 1;

            const fx = nx * forceMag + 3 * smoothedCursorVel.x * falloff;
            const fy = ny * forceMag + 0.3 * forceMag + 3 * smoothedCursorVel.y * falloff;

            item.body.wakeUp();
            item.body.applyForce(new CANNON.Vec3(fx, fy, 0), item.body.position);
          }
        }
      }

      // Apply click shockwave if active
      if (shockwave) {
        shockwave.t += dt;
        const dur = 0.24;
        if (shockwave.t >= dur) {
          shockwave = null;
        } else {
          const decay = 1 - shockwave.t / dur;
          for (const item of items) {
            if (item === featuredItem) continue;
            const dx = item.body.position.x - shockwave.x;
            const dy = item.body.position.y - shockwave.y;
            const dist = Math.hypot(dx, dy);
            const reach = 6.2 + item.size * 0.5;
            if (dist < reach) {
              const t = 1 - dist / reach;
              const f = 220 * t * decay;
              const nx = dist > 1e-4 ? dx / dist : 0;
              const ny = dist > 1e-4 ? dy / dist : 1;
              item.body.wakeUp();
              item.body.applyForce(new CANNON.Vec3(nx * f, ny * f + 0.35 * f, 0), item.body.position);
            }
          }
        }
      }

      // Steer featured item by velocity and grow its scale + collider
      if (featuredItem) {
        const it = featuredItem;
        const { targetX, targetY, targetZ, targetScale } = getFeaturedTarget(it);
        it.bobPhase += dt * (reducedMotion ? 0 : 2.1);
        const bobY = reducedMotion ? 0 : Math.sin(it.bobPhase) * 0.14;
        const swayZ = reducedMotion ? 0 : Math.cos(it.bobPhase * 0.8) * 0.06;
        const swayY = reducedMotion ? 0 : Math.sin(it.bobPhase * 0.65) * 0.11;

        const gain = reducedMotion ? 14 : 6.5;
        it.body.velocity.set(
          (targetX - it.body.position.x) * gain,
          (targetY + bobY - it.body.position.y) * gain,
          (targetZ - it.body.position.z) * gain
        );

        // Steer rotation toward showcase pose
        const spec = MODEL_SPECS.find(s => s.key === it.key);
        eulerTmp.set(
          spec.pose.x,
          spec.pose.y + swayY,
          spec.pose.z + swayZ
        );
        targetQuat.setFromEuler(eulerTmp);
        tmpQuat.set(it.body.quaternion.x, it.body.quaternion.y, it.body.quaternion.z, it.body.quaternion.w);
        if (tmpQuat.dot(targetQuat) < 0) {
          targetQuat.set(-targetQuat.x, -targetQuat.y, -targetQuat.z, -targetQuat.w);
        }
        deltaQuat.copy(targetQuat).multiply(tmpQuat.clone().invert());
        const angle = 2 * Math.acos(Math.min(1, Math.max(-1, deltaQuat.w)));
        const sinHalf = Math.sqrt(Math.max(0, 1 - deltaQuat.w * deltaQuat.w));
        if (sinHalf > 1e-4 && angle > 1e-4) {
          const rotGain = reducedMotion ? 12 : 5.5;
          it.body.angularVelocity.set(
            (deltaQuat.x / sinHalf) * angle * rotGain,
            (deltaQuat.y / sinHalf) * angle * rotGain,
            (deltaQuat.z / sinHalf) * angle * rotGain
          );
        } else {
          it.body.angularVelocity.set(0, 0, 0);
        }

        // Grow scale smoothly and rebuild collider every time it grows by 10% or more
        it.currentScale += (targetScale - it.currentScale) * Math.min(1, dt * 7);
        it.mesh.scale.setScalar(it.currentScale);
        if (Math.abs(it.currentScale - it.lastColliderScale) / it.lastColliderScale >= 0.10) {
          applyColliderToBody(it, it.currentScale, false);
        }
      }

      // Step physics world
      world.step(1 / 60, dt, 3);

      // Update each item's velocities, laptop lid spring, and mesh transform
      for (const item of items) {
        if (item !== featuredItem) {
          // Clamp speed to 13 and spin to 5 every frame
          const vLen = item.body.velocity.length();
          if (vLen > 13) {
            item.body.velocity.scale(13 / vLen, item.body.velocity);
          }
          const wLen = item.body.angularVelocity.length();
          if (wLen > 5) {
            item.body.angularVelocity.scale(5 / wLen, item.body.angularVelocity);
          }
          // Smoothly return scale if shrinking back
          if (Math.abs(item.currentScale - item.size) > 0.002) {
            item.currentScale += (item.size - item.currentScale) * Math.min(1, dt * 14);
            item.mesh.scale.setScalar(item.currentScale);
          }
        }

        // Laptop lid spring mechanics
        if (item.key === 'laptop' && item.laptopHinge) {
          const airGap = now - item.lastContactTime;
          if (airGap > 90) {
            if (item.inContact) {
              item.inContact = false;
              item.leaveContactY = item.body.position.y;
            }
          }

          let targetLidAngle = -0.3;
          let k = 60, c = 9;

          if (item === featuredItem) {
            targetLidAngle = -0.3;
            item.lidShut = false;
            k = 60; c = 9;
          } else if (item.lidShut) {
            targetLidAngle = Math.PI / 2;
            k = 320; c = 18;
            // While in the air, open the lid in proportion to how high it has risen since leaving contact (fully open after rising 3 units)
            if (!item.inContact) {
              const risen = Math.max(0, item.body.position.y - item.leaveContactY);
              if (risen > 0.15) {
                const openFrac = Math.min(1, risen / 3);
                targetLidAngle = (Math.PI / 2) * (1 - openFrac) + (-0.3) * openFrac;
                k = 60; c = 9;
                if (openFrac >= 0.95) {
                  item.lidShut = false;
                }
              }
            }
          } else if (!item.inContact) {
            const risen = Math.max(0, item.body.position.y - item.leaveContactY);
            const openFrac = Math.min(1, risen / 3);
            targetLidAngle = THREE.MathUtils.lerp(item.lidAngle, -0.3, openFrac);
            k = 60; c = 9;
          }

          const acc = -k * (item.lidAngle - targetLidAngle) - c * item.lidVel;
          item.lidVel += acc * dt;
          item.lidAngle += item.lidVel * dt;

          // Small bounce when slamming shut at pi/2
          if (item.lidAngle > Math.PI / 2) {
            item.lidAngle = Math.PI / 2;
            if (Math.abs(item.lidVel) > 0.4) {
              item.lidVel = -item.lidVel * 0.28;
            } else {
              item.lidVel = 0;
            }
          }
          if (item.lidAngle < -0.35) {
            item.lidAngle = -0.35;
            item.lidVel = 0;
          }

          item.laptopHinge.group.rotation.x = item.lidAngle;
          // Raise hinge pivot as the lid closes so it folds onto the deck instead of passing through it
          const closeProgress = Math.max(0, Math.min(1, (item.lidAngle - (-0.3)) / (Math.PI / 2 + 0.3)));
          item.laptopHinge.group.position.y = item.laptopHinge.baseY + closeProgress * 0.14;

          // Swap collider to box when shut, or back to convex hull when open
          const isNowShut = closeProgress > 0.88 && item !== featuredItem;
          if (isNowShut !== item.isBoxCollider && item !== featuredItem) {
            applyColliderToBody(item, item.currentScale, isNowShut);
          }
        }

        item.mesh.position.copy(item.body.position);
        item.mesh.quaternion.copy(item.body.quaternion);
      }

      renderer.render(scene, camera);
    }

    await loadTemplates();
    dropPile();
    requestAnimationFrame((t) => {
      lastTime = t;
      animate(t);
    });
  </script>
</body>
</html>
