  <script>
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const videos = [...document.querySelectorAll('video')];
    const toggle = document.querySelector('.motion-toggle');
    let paused = reduced.matches;
    async function applyPlayback() {
      if (paused) {
        videos.forEach(video => video.pause());
      } else {
        const results = await Promise.allSettled(videos.map(video => video.play()));
        if (results.every(result => result.status === 'rejected')) paused = true;
      }
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.querySelector('.motion-label').textContent = paused ? 'Play videos' : 'Pause videos';
      toggle.querySelector('.motion-icon').textContent = paused ? '▷' : 'Ⅱ';
    }
    toggle.addEventListener('click', () => {
      paused = !paused;
      applyPlayback();
    });
    reduced.addEventListener('change', () => {
      paused = reduced.matches;
      applyPlayback();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) videos.forEach(video => video.pause());
      else applyPlayback();
    });
    applyPlayback();

    // Let type and photographs settle before the single entrance sequence.
    const imageReady = [...document.images].map(image => image.decode().catch(() => {}));
    Promise.race([
      Promise.all([document.fonts.ready, ...imageReady]),
      new Promise(resolve => setTimeout(resolve, 1800))
    ]).then(() => requestAnimationFrame(() => document.documentElement.classList.add('is-ready')));
  </script>
